[package]
name = "codesift"
version = "0.1.0"
edition = "2021"
authors = ["CodeSift Team"]
description = "Token-efficient code intelligence engine for AI agents"

[dependencies]
# Core parsing
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Storage - no external deps needed

# Utilities
rayon = "1.10"  # Data parallelism
walkdir = "2.5"
ignore = "0.4"
same-file = "1.0"
regex = "1"
hashbrown = "0.15"
smallvec = "1.13"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"

# Filesystem watching (incremental indexing)
notify = "6.1"

# Serialization for semantic index
bincode = { version = "1.3", optional = true }

[features]
default = []
semantic = ["dep:bincode"]

[dev-dependencies]
criterion = "0.5"
tempfile = "3.12"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "context_planning"
harness = false

[[bench]]
name = "token_efficiency"
harness = false

[[bench]]
name = "memory_usage"
harness = false

[lib]
name = "codesift"
path = "src/lib.rs"

[[bin]]
name = "codesift"
path = "src/main.rs"
